<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Studies | Prisha Srivastava</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #FAF6F0;
      --cream-mid: #F2EBE1;
      --cream-border: #E0D0C4;
      --maroon: #6b1a1a;
      --maroon-light: #f5e8e8;
      --text-dark: #1a1a1a;
      --text-mid: #555;
      --text-muted: #999;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--cream);
      color: var(--text-dark);
      font-family: 'DM Sans', sans-serif;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 48px;
      border-bottom: 1px solid var(--cream-border);
      background: var(--cream);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-name {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 500;
      color: var(--maroon);
      text-decoration: none;
    }

    .nav-links { display: flex; gap: 32px; }

    .nav-links a {
      font-size: 13px;
      color: var(--text-mid);
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .nav-links a:hover { color: var(--maroon); }

    .page-header {
      padding: 72px 48px 48px;
      background: var(--cream);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--maroon);
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 40px;
      font-weight: 500;
      color: var(--text-dark);
      line-height: 1.2;
      margin-bottom: 14px;
    }

    .page-header p {
      font-size: 15px;
      color: var(--text-mid);
      line-height: 1.7;
      max-width: 520px;
      font-weight: 300;
    }

    .divider { height: 1px; background: var(--cream-border); margin: 0 48px; }

    .content {
      padding: 64px 48px;
      background: var(--cream-mid);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 360px;
      justify-content: center;
    }

    .coming-soon-label {
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--maroon);
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .coming-soon-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 500;
      color: var(--text-dark);
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .coming-soon-sub {
      font-size: 15px;
      color: var(--text-mid);
      line-height: 1.7;
      max-width: 440px;
      font-weight: 300;
      margin-bottom: 32px;
    }

    .placeholder-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 800px;
      margin-top: 8px;
    }

    .placeholder-card {
      background: var(--cream);
      border: 1px dashed var(--cream-border);
      border-radius: 8px;
      padding: 32px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .placeholder-card p {
      font-family: 'Playfair Display', serif;
      font-size: 13px;
      color: #ccc;
    }

    footer {
      padding: 18px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--cream-border);
      background: var(--cream);
    }

    .footer-text { font-size: 12px; color: var(--text-muted); }
    .footer-links { display: flex; gap: 24px; }
    .footer-links a { font-size: 12px; color: var(--maroon); text-decoration: none; }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      nav { padding: 18px 24px; flex-wrap: wrap; gap: 12px; }
      .nav-links { gap: 18px; flex-wrap: wrap; }
      .divider { margin: 0 24px; }
      .page-header { padding: 56px 24px 36px; }
      .page-header h1 { font-size: 32px; }
      .content { padding: 48px 24px; }
      .placeholder-cards { grid-template-columns: repeat(2, 1fr); }
      footer { padding: 18px 24px; }
    }
    @media (max-width: 600px) {
      nav { padding: 14px 20px; flex-direction: column; align-items: flex-start; gap: 10px; }
      .nav-links { gap: 14px; }
      .nav-links a { font-size: 12px; }
      .page-header { padding: 40px 20px 28px; }
      .page-header h1 { font-size: 28px; }
      .content { padding: 36px 20px; }
      .placeholder-cards { grid-template-columns: 1fr; }
      .divider { margin: 0 20px; }
      footer { flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px 20px; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-name" href="index.html">Prisha Srivastava</a>
    <div class="nav-links">
      <a href="about.html">About</a>
      <a href="case-studies.html">Case Studies</a>
      <a href="projects.html">Projects</a>
      <a href="experience.html">Experience</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="page-header">
    <p class="eyebrow">Case Studies</p>
    <h1>Deep Dives Into Real Problems.</h1>
  </div>

  <div class="divider"></div>

  <div class="content">
    <div class="placeholder-cards">
      <div class="placeholder-card"><p>Case Study 01: Coming Soon</p></div>
      <div class="placeholder-card"><p>Case Study 02: Coming Soon</p></div>
      <div class="placeholder-card"><p>Case Study 03: Coming Soon</p></div>
    </div>
  </div>

  <footer>
    <span class="footer-text">Prisha Srivastava &copy; 2026</span>
    <div class="footer-links">
      <a href="https://www.linkedin.com/in/prisriva/" target="_blank">LinkedIn</a>
      <a href="contact.html">Contact</a>
    </div>
  </footer>

</body>
</html>
